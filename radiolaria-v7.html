<script>
/* SPORATIC GEOMETRIES — RESTART, ONE LAYER (Calvin, 2026-11-18):
   "Lets start again with just one layer, the radiolaria generator."
   Only the Radiolaria generator, alone on the dark field, centred.
   Each 24s pass deals a new radiolaria from its own continuing stream
   (layer:radiolaria — never reseeded). Colour: its band of the spectrum
   (offset 0.38), sliding slowly, jumping at each retrigger.
   Calvin delta on 001: CONNECT ALL POINTS with added line work — every
   spoke tip is now joined to its neighbours, closing an irregular
   polygon web around the skeleton.
   Calvin delta on 002: CROSS-CHORDS TOO — every tip connected to every
   other tip (complete graph), drawn faint and thin behind the skeleton
   so the web reads as a woven field. Open with #grid for a 2x2 sheet.
   Calvin delta on 003: bring the chords UP, tiered by length within each
   deal — shortest third at FULL opacity, mid third at 2/3, longest third
   at 1/3. Same stream seed as 003, so the deals match for comparison.
   Calvin delta on 004: confirmed the loop trigger was 7 seconds and
   moved it to 12 SECONDS — the retrigger (and the hue jump) now lands
   every 12s. Nothing else changed.
   Calvin delta on 005: the radiolaria no longer pops in static — it
   GROWS out from the centre for the first 6 seconds of the pass, peaks
   at full size at the midpoint, then SHRINKS back to nothing over the
   second 6 seconds, vanishing exactly at the retrigger.
   Calvin delta on 006: the frame looked too small on his phone. The
   canvas was already 720x720 — the phone was shrinking it (no viewport
   tag, so the browser laid the page out ~980px wide and zoomed out).
   Now: viewport tag + the canvas fills the phone's full width, still
   720-native, capped at 720px on larger screens.
   Calvin delta on 008: WITHOUT THE SPOKES AND CIRCLES — the radiating
   spokes, the concentric rings and the centre hub are not drawn; only
   the points and their line work remain (neighbour web + tiered
   cross-chords + tip dots). Same deals, same 19s grow/rest/shrink.
   Calvin delta on 009: full length extended to 24 SECONDS — grow-up
   3.5s, hold 17s, shrink back 3.5s.
   Calvin delta on 010: the linework and dots as BRIGHT as possible
   while keeping the opacity levels — ink lightness 64% -> 80%, the
   brightest the hue holds before it washes toward white. Every alpha
   untouched: chords full / 2/3 / 1/3 by length, neighbour web 0.55,
   dots 0.95.
   Calvin delta on 011: the dot points WOBBLE/SWAY independently, as on
   the Hash-Seed Harmonic Synthesizer — each point is dealt its own sway
   (amplitude 2.5–6.5px, own rate 0.5–1.2 rad/s, own phase) and rides a
   small circle around its dealt position; the web and chords follow
   the points, so the whole net breathes during the hold.
   Calvin delta on 012: make the wandering MORE DRAMATIC and THROUGHOUT
   THE FULL LENGTH — each point now also rides a broad dealt ellipse
   (12-26px by 8-20px) that completes exactly one circuit across the
   whole 24s pass, layered over a faster, larger wobble (4-8px). The
   wandering never stops: grow, hold and shrink alike.
   Calvin delta on 013: ALL DOTS CONNECT WITH LINEWORK — the dot-to-dot
   chain that strings every point in order and closes is brought to
   full strength (opacity 1.0, 1.6px), so every dot visibly sits on one
   continuous line, on top of the tiered all-to-all chords beneath it.
   Calvin delta on 014: lines POP in and out as the dots wander — the
   chord tiers were being re-ranked from the LIVE lengths every frame,
   so a line crossing a third-boundary jumped tier mid-pass. Fix: each
   line's tier is ranked ONCE from the dealt home positions and kept
   for the whole pass; the endpoints wander, the opacities never move.
   POST-v1 STUDY (the locked v1 snapshot is untouched): Calvin brings
   back the PARTICLE SWARM, kept OUTSIDE the linework — a dealt halo of
   dust in the annulus beyond the web's furthest point, on its own
   stream (layer:particleswarm) and its own spectrum band (0.08). The
   swarm rides the same envelope as the web: grows out over 3.5s, holds
   (swarming in place) for 17s, shrinks back to nothing over 3.5s.
   Calvin delta on 016: bring back the LENIA FIELD, confined WITHIN
   the linework — its growth mask is the dealt polygon and the drawing
   is clipped to the live wandering polygon, so the flesh lives inside
   the web and nowhere else. Own stream (layer:lenia), own band (0.72,
   violet). Seeded fresh each pass (heart + scattered blobs), it rides
   the same envelope as everything else.
   Calvin delta on 017: the flesh still reads PIXELATED, and he asked
   what levers Lenia has. This study pulls the finish levers: grid
   110 -> 160 (finer cells), kernel 10 -> 15 (same physical form
   size), seed blobs scaled to match, and a 2px softening pass on the
   flesh draw so the cell edges melt. Appetite, speed, band untouched.
   Calvin delta on 018 — he set the Lenia levers himself: presence
   GHOST (alpha ceiling 0.59 -> 0.30), speed INCREASED (2 steps per
   frame, dt 0.12), seeding INCREASED (heart + 26 blobs, wider claim),
   pickiness NARROWER (sigma 0.058 -> 0.040), appetite HIGHER
   (mu 0.28 -> 0.32), kernels SMALL (radius 15 -> 9 cells).
   Calvin delta on 019: bring back the SMOOTHLIFE wash — a soft
   shimmering stratum UNDER the Lenia, confined within the linework
   the same way (polygon growth mask + live clip), on its own stream
   (layer:smoothlife) and band (0.84, rose), with the slow brightness
   pulse from the organism samples. Seeded fresh each pass.
   Calvin delta on 020: bring back THE SHIMMER — in 020 the wash
   returned too dim for its pulse to read. Restored to its Sample 006
   character: full-strength stratum (alpha ceiling ~0.73), a wide slow
   pulse (0.70 +/- 0.30, ~3s period), stepped every frame so its
   surface crawls while it breathes.
   QA catch before delivery: the wash's first rule (additive update,
   disc seeding) starved to zero within ~140 steps — the shimmer
   would have died seconds into every pass, and the grid sheets were
   silently identical because of it. Fixed and verified headless:
   blend update (each cell moves 35% toward its target per step) +
   patchy noise seeding; the field sustains indefinitely (600-step
   test: stable, thousands of active cells).
   Calvin delta on 021: the SmoothLife shimmer should LOCK TO THE
   SAME COLOUR as the Lenia and share its GHOSTLY PRESENCE — wash hue
   offset +0.46 (band 0.84, rose) -> +0.34 (band 0.72, the flesh's own
   violet), and its alpha ceiling 185 -> 77 (0.30, the flesh's ghost
   ceiling); the pulse now breathes UNDER that ceiling, peaking
   exactly at the flesh's strength and never past it.
   Calvin delta on 022: TAKE IT VOLUMETRIC. The organism leaves the
   disc: points are dealt onto a spherical shell (same deals, plus a
   dealt polar angle), the linework is tiered by dealt 3D distance
   (ranked once, as in 2D), the flesh becomes a volumetric sprite
   cloud sampled from the living fields and extruded through the
   ball, and the swarm moves out onto a shell in space. The whole
   volume turns half a revolution per pass (as the synth's sphere),
   tilted, with depth cueing throughout. First step toward SPINAL.
   Calvin delta on 023: ENLARGE THE SPRITE CLOUD so it SPANS THE FULL
   FRAME at the rest point (the peak hold). The cloud is no longer
   sized to the web ball: the fields' footprint is normalised to the
   dealt rim and remapped onto a frame-filling radius (0.98 x the
   half-frame), so at full size the cloud touches the frame edges
   whatever the deal, and the net sits inside it.
   Calvin delta on 024: THE SHIMMER TAKES A FEW ROUNDS TO START
   WORKING. Measured: a fresh wash starts as scattered noise at ~53%
   of its working mass and needs ~100 steps to coalesce into the
   broad shimmer (coverage at strength 30% -> 52% by step 100, then
   a stable plateau). Fix: the wash is PRE-ROLLED 120 steps inside
   seedSmooth, so every pass — the first one included — starts with
   the shimmer already working.
   Calvin delta on 025: BRING ALL OF THE LINEWORK UP TO FULL OPACITY.
   The length tiers (shortest 1.0 / mid 2/3 / longest 1/3, his Study
   004 system) are superseded: every cross-chord now draws at 1.0,
   and the depth-cue dimming no longer applies to lines — chords and
   chain alike are at full opacity everywhere. Dots keep their depth
   cue; widths unchanged.
   Calvin delta on 026: HAVE THE RADIOLARIA GROW TO A BIT LARGER
   SIZE, KEEPING IT IN FRAME. The dealt 3D base positions scale up
   x1.22 at deal time, clamped so the web's radius never exceeds a
   frame-safe cap (335 live / 171 per grid cell — silhouette ~345 /
   ~176 against half-frames of 360 / 180). Deals keep their size
   variety below the cap; the swarm shell and depth cue follow the
   enlarged radius automatically.
   Calvin delta on 027: COLOUR GRADIENT SHIFTS THROUGHOUT THE SPRITE
   CLOUD. The cloud is no longer one flat hue: each sprite's hue is
   dealt from its place in the volume — the gradient runs through
   the ball's depth (+/-0.18 of the spectrum, front to back) with a
   further +0.08 toward the rim, centred on the flesh band (the 022
   lock holds at the gradient's middle). The gradient is a property
   of the volume — it turns with the ball — and the whole sweep
   keeps sliding with the hue phase, as the palette always has.
   Calvin delta on 028: SOME LINES SEEM MORE BOLD THAN OTHERS — BRING
   THEM ALL UP TO MATCH. The difference was width, not opacity: the
   dot-to-dot chain draws at 1.6px while the cross-chords drew at
   0.7px. The chords now draw at 1.6px too — every line in the web
   is the same weight at the same full opacity.
   Calvin delta on 029: TRANSPARENT COLOURED FACES ON THE SHAPE SIDES.
   Yes — the dealt points' convex hull is computed at deal time
   (brute force over triples, <=21 points): its triangles are the
   shape's sides. Each face fills at low alpha in the web's hue,
   shifted by the face's own depth in the ball (the cloud gradient's
   language), dimmed a touch at the back by the depth cue, drawn
   far-to-near over the cloud and under the lines — front and back
   faces both show, so the volume reads as stained glass.
   Calvin delta on 030: PANES A LITTLE STRONGER AND GLASSY IF
   POSSIBLE, COLOUR COMPLEMENTARY TO THE LINES. Face hue is now the
   complement of the line hue (+0.5 of the wheel, the depth shift
   kept). Glass: each pane's view-space normal is measured per
   frame — panes facing the viewer catch the light (stronger,
   lighter, less saturated: the sheen), edge-on panes go faint.
   Base alpha 0.15 -> 0.26 before the facing/depth shaping.
   Calvin delta on 031: TRAP THE SPRITE CLOUD INSIDE THE LINES AND
   PANES. The hull's outward face planes are stored at deal time;
   every sprite is tested against all of them in object space and
   only drawn if it lies inside every plane — the cloud now fills
   the crystal and takes its faceted shape, nothing spilling past
   the panes. (The swarm stays outside, as dealt.)
   Calvin delta on 032: MAKE THE SPRITE CLOUD MORE OPALESCENT. The
   cloud's body goes milky and pearly (saturation down to 74%,
   lightness up to the high 80s/90s at its hot core), and thin-film
   colour bands run through its depth: they crawl as the hue phase
   slides and ripple as the volume turns — opal's play-of-colour —
   over a fine per-cell patchwork jitter, the harlequin flash. The
   material gradient stays underneath it all.
   Calvin delta on 033: LIMIT THE NUMBER OF POINTS — SOME SHAPES ARE
   TOO COMPLEX FOR THE LOOK. The deal was 9-21 points (up to 210
   cross-chords and a thicket of panes); the count now deals 9-14
   (at most 91 chords). The cap is the single number in rr(9, 15) —
   one word retunes it.
   Calvin delta on 034: THE SPRITE CLOUD FINDS ITS WAY OUT OF THE
   SHAPE ON THE EDGES FROM TIME TO TIME. Found it: the trap tested
   sprites against the DEALT hull, but the panes are drawn through
   the WANDERING points — whenever a vertex wandered inward, its
   pane cut inside the tested hull and the cloud leaked past the
   visible edge. Fix: the cage is rebuilt every frame from the live
   wandering points (same face topology), so the trap and the panes
   are the same surface at every moment.
   RADIOLARIA v2 LOCKED from study 035 (see sporatic-radiolaria-
   V2-LOCK.md). Everything below is post-v2.
   Calvin deltas on v2: PANES A LITTLE MORE CLEAR (base alpha
   0.26 -> 0.17); DEEPEN THE COLOUR OF THE LINEWORK; APPLY THE
   COLOUR PALETTE FROM THE HASH-SEED HARMONIC SYNTHESIZER AND VARY
   THE COLOURS OF THE DOTS; HAVE THE LINEWORK SHIFT COLOURS
   DYNAMICALLY BETWEEN POINTS. The palette is Tidal's six neon dot
   colours, exactly as the synth carries them: #b6ff00, #00ff66,
   #00f0ff, #2e6bff, #8b2bff, #ff2bd6. Each point is dealt one, then
   slowly cycles through the palette (crossfading, desynchronised
   per point); dots draw in their point's current colour, and every
   line is a gradient between its two points' colours — so the
   linework shifts colour between points and over time. The
   palette's native grade (~50% lightness against the old ink's
   80%) is the deepening.
   Calvin delta on 036: THE SPARKLE IS CAUSING A FLICKERING — FIX IT
   TO BE SLOWER AND SMOOTHER. Four temporal fixes, no look changes:
   (1) each sprite's drawn intensity now eases toward the fields'
   value (a per-cell smoother, ~8-frame memory) instead of snapping
   to it every step, so cells fade in and out rather than popping;
   (2) the shimmer pulse slows from a ~3s breath to ~7s and softens
   (0.78 +- 0.22); (3) the dust swarm's orbital jitter slows from
   0.8-2.0 to 0.25-0.6 rad/s — a drift, not a sparkle; (4) the opal
   film bands crawl at half speed. The fields themselves run at
   their set pace underneath; only what is drawn is smoothed.
   Calvin delta on 037: CLOUD STILL HAS A FLICKER WHEN THE SPARKLE
   HITS. Three deepenings of the same fix: (1) the intensity memory
   lengthens (0.12 -> 0.055 per frame, ~18 frames) so brightness
   rides over the fields' fastest churn; (2) the opal film bands —
   the sparkle itself — broaden and gentler (amplitude 0.22 -> 0.15,
   spatial frequency 2.6 -> 1.8), so a band's arrival is a slow wash
   across the cloud, not a flicker front; (3) sprites now dissolve
   at the panes (alpha fades over their last 12px inside the cage)
   instead of popping out of existence when the wandering cage
   passes them.
   Calvin delta on 038: THE DOT COLOURS SHOULD SHIFT AROUND
   THROUGHOUT THE HOLD PHASE AND FADE IN THROUGH EACH COLOUR. The
   palette cycling is now driven by a colour clock that runs ONLY
   during the hold (frozen through grow and shrink, reset each
   deal), at 0.35 palette steps a second — so across the 17s hold
   each point fades through the whole six-colour wheel, each from
   its own dealt starting colour, desynchronised. The lines follow
   the dots, being gradients of their colours.
   Calvin delta on 039: SEE IT WITH THE SHIMMER REMOVED FROM THE
   SPRITE CLOUD — he can't tell if the flicker is the shimmer or
   the growth itself. Diagnostic audition: the SmoothLife term is
   cut from the sprites' intensity, so the cloud is the Lenia
   growth alone (its weight lifted 0.85 -> 1.0 to hold the cloud's
   body). Everything else — smoothing, colour travel, cage — is
   exactly 039, so the comparison isolates the one ingredient.
   Calvin verdict on 040: STILL FLICKERS, PARTICULARLY WHEN DENSE —
   so the shimmer is exonerated; the growth itself is the source.
   Study 041 (built on 040, shimmer still out) attacks the growth
   side two ways: (1) the Lenia is stepped every other frame — half
   the churn that was aliasing into flicker where the cloud is
   dense; (2) the opal film bands are anchored to the volume's own
   depth instead of the view depth, so turning no longer churns
   every sprite's hue — the bands still crawl with the hue phase.
   ALSO, Calvin's ask in the same breath: THE PARTICLE SWARM BITS
   NOW TWINKLE — each particle dealt its own slow fade (6-14s,
   smoothstepped sine, full fade out and in), desynchronised, so
   the dust winks randomly.
   Calvin on 041: MUCH BETTER, BUT ONE FLICKER REMAINS. Measured
   suspect: the Lenia seed itself. The heart + blobs seed writes
   roughly twice the life the growth rule can sustain — field sum
   ~2,500-2,700 with ~5,100-6,300 active cells — and it crashes by
   half within the first 10 steps (the single biggest change of
   the field's whole life, once per pass), before settling into
   its living range (~2,000-2,500 sum) around step 80-120. One
   violent event per pass, at its start. Fix, same as the
   shimmer's in 025: PRE-ROLL — seedLenia now runs 60 steps before
   the pass is ever drawn, so the crash and the first
   reorganisation happen offstage and the flesh opens already
   living.
   Calvin on 042: (A) THE GROW PHASE IS MISSING ITS FIRST BIT — THE
   SHAPE POPS ONTO SCREEN FROM ABOUT HALF SIZE. Found it, and it is
   the pre-rolls' cost: the pass clock was stamped BEFORE the heavy
   seeding (60 Lenia + 120 SmoothLife steps plus the hull), so the
   first second-plus of every grow was spent computing and the
   shape arrived at whatever size the clock had reached. The clock
   is now stamped AFTER the seeding work — the grow runs its full
   3.5s from zero. (B) STILL A FLICKER, ~9 LOOPS IN, MID-PASS. The
   two remaining mechanisms that can pop mid-pass are removed:
   sprite brightness is now RATE-LIMITED (it can never change
   faster than 0.015 a frame, whatever the field does — a pattern
   collapse becomes a slow fade), and the panes and lines draw in
   a fixed order instead of being re-sorted by depth every frame
   (each re-sort swap was a small pop at an overlap).
   Calvin delta on 043: DROP THE GROW UP / SHRINK DOWN — JUST HAVE
   THE DOTS SHIFT INTO NEW POSITION AT EACH TRIGGER. Study 044
   rebuilds the pass around that: the shape never scales. At each
   trigger the points glide from the old deal's positions to the
   new one's over 3.5s (smoothstep), the web re-knitting as they
   travel; points the new deal adds are born at its centre and
   travel out, points it drops glide into the centre and fade.
   Colours crossfade across the shift; the cloud's brightness
   memory is kept across deals so the glow crossfades too, and the
   hull, panes and cage are rebuilt from the live points every
   frame, so the whole volume morphs as one body.
   Calvin on 053: I THINK I SAW A REMNANT OF THE PARTICLE SWARM.
   He was right about the file: the study-050 removal cut the old
   dealSwarm but left drawSwarm's body standing in the file,
   orphaned with its inkS helper and the particleswarm stream —
   dead code with no call sites (it could not draw), but a
   remnant all the same. Swept properly here: drawSwarm, inkS,
   and the swarm stream are gone; the only swarm mentions left
   are in this header's history.
   Calvin delta on 054: DROPPED POINTS SIMPLY FADE WHERE THEY
   STAND. The ghosts no longer glide to the centre — each stays
   at its own place in the formation, wandering as it always did,
   and fades out across the shift.
   Post-v3 study 056. Calvin: MAKE THE RADIOLARIA DOTS LARGER AND
   ADD AN INK COLOURED DOT TO THE CENTRES. Dot radius factor
   0.8 -> 1.3 (about 1.6x), and each dot now carries a core at
   42% of its radius in the engine's Ink (the spectrum ink at 80%
   lightness). Ghosts get the same treatment as they fade.
   Post-v3 study 057. Calvin: DOUBLE THE LIVING CLOUD DENSITY
   AGAIN. Each living cell now draws FOUR sprites (two in 053,
   one before that) — three companions jittered within the cell,
   each with its own depth.
   Post-v3 study 058. Calvin: MAKE THE DOTS LARGER AND THE LINES
   THICKER. Dot radius factor 1.3 -> 2.0; line weight 1.6px ->
   2.4px (chords and chain alike).
   Post-v3 study 059. Calvin: EXTEND THE LOOP BY 4 SECONDS, to
   give the gradients more time to run their course. PASS_MS
   16000 -> 20000 (shift still 3.5s; settled 12.5s -> 16.5s).
   The colour rate eases 0.48 -> 0.364 steps/s so the wheel
   still completes exactly once per loop — the same full course,
   run slower. Rotation follows the loop as always.
   Study 060. Calvin: IT LOADS A BIT HEAVY — CLEAN UP ANY CODE
   OR REDUCE THE WEIGHT ON CPU. A performance pass that changes
   NO output: (1) the projection's tilt/rotation trig is computed
   once per frame instead of once per sprite; (2) the cloud's
   per-cell hash values are precomputed once into tables instead
   of a Math.sin per sprite per frame; (3) both fields' inner
   loops skip bounds checks for interior cells (same sums, same
   order); (4) the cage test gains an inscribed fast path —
   sprites well inside skip the plane loop entirely; (5) the
   old 2D blit renderers (renderLenia/renderSmooth + their
   canvases), dead since the volumetric turn, are removed.
   Study 061. Calvin: CAN THE SPRITE CLOUD GO THROUGH A COLOR
   GRADIENT PER LOOP AS WELL? Yes — the cloud's hue is now
   carried by the same colour clock as the dots and lines: from
   its violet band it travels the full spectrum across the
   settled stretch and lands back on its band as the loop ends,
   exactly one cycle per loop, freezing during the shift just
   as the line colours do. (The slow huePhase drift no longer
   drives the cloud's base; the film bands still crawl with it.)
   Study 062. Calvin: PUT A SMALLER DARK GREY DOT ONTO EACH
   POINT DOT AT 80% OPACITY. Each point dot gains a dark grey
   pupil (rgb 46,46,46) at 24% of its radius, centred on top of
   the Ink core — bead, pale ring, dark pupil. Ghosts carry the
   pupil too, fading with them.
   Study 063. Calvin: REPLACE THE PALE RING WITH THE DARK GREY
   CIRCLE. The Ink core is gone; in its place the dark grey
   circle sits at the ring's own size (42% of the dot), still at
   80% opacity — bead and dark centre, two layers. Ghosts match.
   Study 064. Calvin: REDUCE THE SIZE OF THE BEADS SLIGHTLY.
   Dot radius factor 2.0 -> 1.7 (the grey centre scales with
   its bead, as always).
   Study 065. Calvin: CAN I SEE IT WITH THE SPOKES PUT BACK,
   WITH THE LINEWORK PARAMETERS. The spokes return: from the
   organism's projected centre to every point, drawn in the
   linework's own terms — each spoke in its point's current
   palette colour, 2.4px, full strength — laid under the chords
   so the web still crosses over them.
   Study 066. Calvin locked 065 as v4, then: LETS PLAY WITH THE
   GENERATION PARAMETERS — the dot count maxes and mins out.
   He is right: the count is dealt rr(9, 15) = 9-14 points
   (study 034 set that cap, down from 9-21). This study makes
   the range two variables (CNT_LO / CNT_HI, defaulting to the
   locked 9 / 15) and adds a #counts sheet: four deals at four
   ranges — 5-8, 9-14 (current), 15-21, 22-30 — so the count's
   effect can be seen side by side. Live mode is unchanged.
   Study 067. Calvin: LETS DO 9 TO 19, AND MAKE THE BEAD SIZE
   UNIFORM AND CONSISTENT ACROSS LOOPS. The count range widens
   to 9-19. The beads lose their dealt sizes (tip rr(2.0, 4.6)
   made every bead — and every loop — a different size): one
   fixed radius BEAD_R = 5.6, the old average, varied only by
   perspective. The grey centres scale with their beads.
   Study 069. Calvin picked the BACKDROP LATTICE from the
   background menu: a huge, dim triangular lattice — the room
   behind the organism — dealt from its own stream off the same
   seed (spacing and rotation offset are dealt), drawn behind
   everything in warm ink, turning with the organism at 0.16x
   its speed. Built once as two paths (inner brighter, outer
   fainter, dots at the crossings), so a frame costs two strokes
   and a fill. Separate from the structure, related by seed,
   geometry and motion.
   Study 070. Calvin: BRIGHTER AND MORE COMPLEX PATTERNING.
   The lattice weave tightens (spacing 80-102 -> 52-68), the
   ink roughly doubles (lines 0.13/0.07, dots 0.18), and an
   intersecting CIRCLE layer joins the triangle grid — a
   circle on every lattice point at radius spacing/2, passing
   through its neighbours' centres: the circle-lattice over
   the triangle grid, in warm ink behind the organism.
   Study 071. Calvin: STRETCH THE LATTICE VERTICALLY AND
   REMOVE THE ROTATION. The room now stands still — only its
   dealt offset angle remains — and the whole lattice (grid,
   circles, dots) is scaled 1.35x in Y: taller triangles,
   oval circles, a room that reaches up.
   Study 072. Calvin: LEVEL THE BACKGROUND, THEN STRETCH
   VERTICALLY STEEPLY. The dealt offset angle goes too — the
   lattice stands plumb level — and the vertical stretch
   steepens from 1.35x to 2.2x: long tall triangles, ovals
   drawn out into arches.
   Study 073. Calvin: STEEPEN TO 2.7x.
   Study 074. Calvin: STEEPEN AT 3X AND CENTER TO HEIGHT.
   The stretch goes to 3.0x, and the lattice is rebuilt
   centred by construction: a crossing sits at the exact
   centre of the frame and the rows run symmetric above and
   below it (before, the rows started from the disc's edge,
   so the pattern's phase against the frame was arbitrary).
   Study 075. Calvin: BRING THE STRETCH STEEPNESS TO 2 AND
   KEEP CENTERED TO HEIGHT. LAT_SY 3.0 -> 2.0; the centred
   construction stands.
   Study 076. Calvin: REPLACE THE BACKGROUND LATTICE WITH A
   TESSELLATION OF THE GENERATED RADIOLARIA, IN THE SAME COLOR.
   The lattice (069-075) is removed entirely. In its place: the
   current deal's own web — chords, spokes, beads — stamped
   across the frame in a 4x4 tessellation, alternate cells
   mirrored, in the lattice's warm ink (chords 0.10, spokes
   0.07, beads 0.16). The portrait is the deal projected at the
   swap moment's angle. Pre-rendered to an offscreen canvas
   once per deal, so a frame costs one drawImage; the room

function seedSmooth(g, H, noPre){
  var poly = [];
  for (var i=0;i<g.spokes.length;i++){ var q = g.spokes[i]; poly.push([Math.cos(q.a) * g.R * q.l, Math.sin(q.a) * g.R * q.l]); }

  for (var y=0;y<SG;y++) for (var x=0;x<SG;x++){

function sg1(x, a, ea){ var t = -(x - a) / ea; if (t > 30) return 0; if (t < -30) return 1; return 1 / (1 + Math.exp(t)); }

  if (!smooth) return;
  var A = smooth.A, U = smooth.U, mask = smooth.mask;
  for (var y=0;y<SG;y++) for (var x=0;x<SG;x++){
    var idx = y*SG+x; if (!mask[idx]){ U[idx] = 0; continue; }

      mi /= INOFF.length;
      for (k=0;k<OUTOFF.length;k++) ni += A[(y+OUTOFF[k][1])*SG + (x+OUTOFF[k][0])];
      ni /= OUTOFF.length;
    } else {
      for (k=0;k<INOFF.length;k++){ xx = x + INOFF[k][0]; yy = y + INOFF[k][1]; if (xx<0 || yy<0 || xx>=SG || yy>=SG) continue; mi += A[yy*SG+xx]; }
      mi /= INOFF.length;
      for (k=0;k<OUTOFF.length;k++){ xx = x + OUTOFF[k][0]; yy = y + OUTOFF[k][1]; if (xx<0 || yy<0 || xx>=SG || yy>=SG) continue; ni += A[yy*SG+xx]; }

}


if (location.hash === '#counts'){

  }
} else if (location.hash === '#grid'){
  // 2x2 sheet: four consecutive deals from the stream
  ctx.fillStyle = '#0d0708'; ctx.fillRect(0,0,W,H);
  var cells = [[180,180],[540,180],[180,540],[540,540]];
  for (var k=0;k<4;k++){ huePhase = 0.38 + k*0.13; var gg = dealRadiolaria(118, 171); seedLenia(gg, 180); for (var st=0; st<220; st++) stepLenia(); seedSmooth(gg, 180); for (var st2=0; st2<140; st2++) stepSmooth(); cloudWarm = false; ctx.drawImage(buildTessellation(gg, 360, 0.5 + k*0.9), cells[k][0] - 180, cells[k][1] - 180); drawVolume(gg, null, 1, cells[k][0], cells[k][1], 9000, 24000, 0.5 + k*0.9, k * 2.9, 9000); }
} else {
  var PASS_MS = 20000, passStart = -1, current = null, prevDeal = null, frameN = 0, colorTime = 0, lastNow = -1, firstNow = -1, nextDeal = null, nextLenia = null, nextSmooth = null, nextSteps = 0; // 20-second loop (Calvin)

    }
